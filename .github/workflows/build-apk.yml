name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # اجرای دستی از تب Actions

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # اگر gradle wrapper وجود نداشت، آن را تولید می‌کنیم
      - name: Generate Gradle Wrapper (if missing)
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Gradle Wrapper not found. Generating..."
            gradle wrapper --gradle-version 8.5
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: List APK output
        run: |
          echo "=== APK files ==="
          find app/build/outputs -name "*.apk" -type f
          ls -lah app/build/outputs/apk/debug/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bank-sms-manager-v1-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
